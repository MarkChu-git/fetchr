schema: spec-driven

context: |
  Write all artifacts in Chinese.
  Product: a reusable extraction engine. The core operation is extract(url), which returns a MediaPost. Download is a client of that result. Public media only. Return a typed error for DRM, login, paywall, or private content. Never bypass them.
  Stack: TypeScript strict (noUncheckedIndexedAccess, exactOptionalPropertyTypes). Effect 4 RC, pinned, with Effect Schema. No Zod, no any. Bun is the local toolchain only. Production is one Cloudflare Worker: TanStack Start, Vite, Cloudflare Vite plugin. No Next.js, Express, NestJS, Fastify, npm, pnpm, or yarn.
  Shape: Bun workspace. Platform differences live only in packages/platform/*. Registry resolves an extractor. Resolver is separate from extractor. Delivery is direct, proxy, mux, or playlist. The Worker resolves, extracts, validates, and signs. It does not transcode, store media, or buffer a full video. No R2, database, or container in the MVP.
  Proxy is GET /download/:token only. HMAC, 1–5 minute TTL, SSRF checks. No open proxy.
  Client mux uses Mediabunny inside a Web Worker. No ffmpeg.wasm and no client transcode in v1.
  Packages are @fetchr/*. The web client is Chinese. UI is Astryx (@astryxdesign/core, pinned beta) plus StyleX, compiled from source so the Worker ships only the components it uses. Theme starts from Stone and follows the system color mode. No Tailwind, no shadcn. Astryx stays inside apps/web.
  Proxy tokens are HMAC-SHA256, 30 minutes, and carry only the upstream URL, the headers the Worker must attach, the expiry, and the platform. A client-supplied URL is ignored.
  Delivery: Direct only when the browser can download a complete file without Referer, Cookie, or User-Agent and without reading bytes. Mux only when the browser can read both streams. Otherwise Proxy. MediaPost owns Delivery. Cache may drop expired URLs; it is not a second domain type.
  CanonicalResource is platform, id, and url. No shared note/reel/short type. No shared Session type. Cookies and signing stay inside the platform package. Core injects Transport only.
  Build order: foundation, core domain, YouTube as the reference extractor (youtubei.js/cf-worker stays inside that package), Xiaohongshu, Douyin, then Instagram, TikTok, Kuaishou, then Bilibili and X.
  When a plan conflicts with itself, prefer abstraction, then security, reliability, platform compatibility, performance, convenience, and feature count.
  Out of scope until the MVP exists: accounts, history, favorites, R2, native apps, extensions, yt-dlp containers, FFmpeg servers, AI features, payments, admin.

rules:
  proposal:
    - Stay inside one phase. Do not pull later platforms or MVP non-goals into the change.
    - Name which module boundary the change may touch.
  specs:
    - Specify observable behavior and typed errors.
    - Require schema decoding for every external payload. Reject unchecked casts.
  design:
    - Worker code uses Web APIs only. No Bun runtime APIs, node:child_process, native binaries, or filesystem assumptions.
    - An Effect, storage, or delivery decision that is hard to reverse gets an ADR.
  tasks:
    - One vertical slice per task, ending with the test that proves it.
    - Do not add a platform extractor before the core domain contract tests exist.

operations:
  apply:
    guidance:
      - Finish the slice with bun test and a typecheck. Do not mark it done on a green unit test alone if it touches Worker code.
  archive:
    guidance:
      - Say which phase exit criteria this change actually met.
