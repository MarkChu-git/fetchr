name: Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: preview
    # Fork PRs never see secrets. They still get verify + e2e from ci.yml.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Deploy the preview version
        id: deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FETCHR_PROXY_SECRET: ${{ secrets.FETCHR_PROXY_SECRET }}
          SECRETS_FILE: ${{ runner.temp }}/secrets.json
        run: |
          printf '{"FETCHR_PROXY_SECRET":"%s"}' "$FETCHR_PROXY_SECRET" > "$SECRETS_FILE"
          bunx cf workers versions create --secrets-file "$SECRETS_FILE" --message "pr ${{ github.event.pull_request.number }}" | tee "$RUNNER_TEMP/cf-out.txt"
          VERSION_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/cf-out.txt" | head -1)
          PREVIEW_URL=$(grep -oE 'https://[0-9a-f]{8}-[a-z0-9-]+\.[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/cf-out.txt" | head -1)
          if [ -z "$VERSION_ID" ] || [ -z "$PREVIEW_URL" ]; then
            echo "cf did not report a version id and preview URL"
            exit 1
          fi
          echo "versionId=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "previewUrl=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "Preview: ${{ steps.deploy.outputs.previewUrl }}"

      - name: Smoke the preview
        run: |
          curl --fail --silent --show-error --max-time 30 "${{ steps.deploy.outputs.previewUrl }}/" -o /dev/null

      - name: Install browsers
        run: bunx playwright install chromium --with-deps

      - name: Playwright against the preview
        env:
          BASE_URL: ${{ steps.deploy.outputs.previewUrl }}
        run: bunx playwright test

      - name: Lighthouse against the preview
        working-directory: apps/web
        run: bunx lhci autorun --config=../../performance/lighthouserc-preview.json --collect.url="${{ steps.deploy.outputs.previewUrl }}/"

      - name: k6 smoke against the preview
        run: |
          bash scripts/ci/install-pinned-tools.sh "${{ runner.temp }}/ci-tools"
          K6_TARGET="${{ steps.deploy.outputs.previewUrl }}" "${{ runner.temp }}/ci-tools/k6" run performance/k6/smoke.js
