name: Performance

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: performance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      # Benchmarks compare the PR against its base on the SAME runner. A
      # committed baseline cannot transfer across machines.
      - name: Benchmark the base
        run: |
          git fetch --depth 1 origin "${{ github.event.pull_request.base.sha }}"
          git checkout --detach "${{ github.event.pull_request.base.sha }}"
          bun install --frozen-lockfile
          bun run bench -- --write "$RUNNER_TEMP/base-baseline.json"

      - name: Benchmark the PR
        run: |
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
          bun install --frozen-lockfile
          bun run bench -- --baseline "$RUNNER_TEMP/base-baseline.json"

      - name: Build the web app
        run: bun run build

      - name: Bundle budget
        run: bun run bundle:check
