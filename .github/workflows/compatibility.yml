name: Compatibility

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      # apps/web/src/routeTree.gen.ts regenerates during the build.
      - name: Generated-code drift
        run: bun run generate:check

      # This repo exposes no OpenAPI contract and has no database. The check
      # reports that honestly instead of manufacturing a fake spec.
      - name: API and migration compatibility
        run: bun run compat
