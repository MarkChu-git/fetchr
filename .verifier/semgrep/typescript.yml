rules:
  - id: no-explicit-any-annotation
    languages: [typescript]
    severity: ERROR
    message: Explicit any is a type hole. Use unknown plus a type guard.
    patterns:
      - pattern: $X
      - metavariable-regex:
          metavariable: $X
          regex: "^[^=]*:\\s*any\\s*[=;,)]"
    paths:
      exclude:
        - "**/*.gen.ts"

  - id: no-as-any
    languages: [typescript]
    severity: ERROR
    message: Never assert through `as any`.
    pattern: $X as any
    paths:
      exclude:
        # Generated by the router plugin.
        - "**/*.gen.ts"

  - id: no-ts-suppress-comments
    languages: [typescript]
    severity: ERROR
    message: "@ts-ignore and @ts-expect-error hide type errors. Fix the type."
    pattern-regex: "@ts-(ignore|expect-error)"

  - id: no-eval
    languages: [typescript]
    severity: ERROR
    message: eval is forbidden.
    pattern: eval(...)

  - id: no-new-function
    languages: [typescript]
    severity: ERROR
    message: "The Function constructor is eval. youtubei.js ships the only justified shim."
    pattern: new Function(...)
    paths:
      exclude:
        # The YouTube player transform runs the platform's own code through the documented shim.
        - "**/packages/platform/youtube/src/extractor.ts"

  - id: no-dangerously-set-html
    languages: [typescript]
    severity: ERROR
    message: dangerouslySetInnerHTML is confined to the root bootstrap script.
    pattern: dangerouslySetInnerHTML={...}
    paths:
      exclude:
        # The root document inlines one static submit interceptor before React attaches.
        - "**/apps/web/src/routes/__root.tsx"
